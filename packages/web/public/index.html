<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip Finder</title>
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>%F0%9F%AA%99</text></svg>">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="mark"></span>Flip Finder</div>

  <div class="feed" id="feed">
    <span class="dot" id="feed-dot"></span>
    <span id="feed-text">connecting…</span>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab active" id="tab-candidates" role="tab">Candidates</button>
    <button class="tab" id="tab-positions" role="tab">Positions</button>
  </nav>

  <div class="spacer"></div>

  <label class="ctl">
    <span>min vol/24h</span>
    <select id="minVol">
      <option value="1000">1,000</option>
      <option value="10000" selected>10,000</option>
      <option value="100000">100,000</option>
      <option value="1000000">1,000,000</option>
    </select>
  </label>

  <label class="ctl">
    <span>max age</span>
    <select id="maxAge">
      <option value="300">5 min</option>
      <option value="600" selected>10 min</option>
      <option value="1800">30 min</option>
      <option value="3600">1 hour</option>
    </select>
  </label>

  <label class="ctl">
    <span>capture</span>
    <select id="capture">
      <option value="0.1">10%</option>
      <option value="0.2" selected>20%</option>
      <option value="0.3">30%</option>
    </select>
  </label>

  <div class="cash" id="cash">
    <span class="cash-label">cash stack</span>
    <span class="cash-value" id="cash-value">not connected</span>
  </div>

  <button class="btn" id="refresh" title="Poll /latest now (r)">Refresh</button>
</header>

<main>
  <section class="table-wrap" id="view-candidates">
    <table id="grid">
      <thead>
        <tr>
          <th class="num">#</th>
          <th data-sort="name">Item</th>
          <th class="num" data-sort="buy">Buy</th>
          <th class="num" data-sort="sell">Sell</th>
          <th class="num" data-sort="netMargin">Net</th>
          <th class="num" data-sort="roi">ROI</th>
          <th class="num" data-sort="volume24h">Vol 24h</th>
          <th class="num" data-sort="tradeableUnits">Units</th>
          <th class="num" data-sort="capitalRequired">Capital</th>
          <th class="num" data-sort="potentialProfit">Potential</th>
          <th class="num" data-sort="stalenessSeconds">Age</th>
          <th class="num" data-sort="spreadZ">Spread z</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </section>

  <section class="table-wrap" id="view-positions" hidden>
    <div id="positions"></div>
  </section>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <h2 id="d-name">—</h2>
      <button class="icon" id="d-close" aria-label="Close">✕</button>
    </div>
    <div id="d-body"></div>
  </aside>
</main>

<footer class="funnel" id="funnel"></footer>

<div class="toast" id="toast" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
